name: Plugin desktop release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Upstream writes its tests for its Linux CI (macOS Chromium, for one, opens no context menu on
  # Shift+F10), so the fork's footprint is checked there too. The macOS job only builds the app.
  check:
    if: github.repository == 'marcelocantos/t3code' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      T3CODE_TELEMETRY_ENABLED: "false"
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=64 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Check changed code
        run: |
          set -euo pipefail
          # Full commit history without blobs (seconds), so ancestry below is exact.
          git fetch --no-tags --unshallow --filter=blob:none origin main:refs/remotes/origin/main
          # A PR that merges an upstream release brings in thousands of upstream
          # files, and testing them all here cannot finish. Compare against the
          # merged upstream commit instead, so the run covers the fork's footprint
          # on top of the new upstream code. Upstream's own CI covers the rest.
          # rev-list lists newest first, so the first match is the latest upstream merge.
          base=origin/main
          for parent in $(git rev-list --merges --parents origin/main..HEAD | cut -d' ' -f3-); do
            if ! git merge-base --is-ancestor "$parent" origin/main; then
              base=$parent
              break
            fi
          done
          echo "check:changed base: $base"
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
          vp run check:changed "$base"

  macos:
    if: github.repository == 'marcelocantos/t3code'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      T3CODE_PLUGIN_BUILD: "1"
      T3CODE_TELEMETRY_ENABLED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=64 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Verify architecture
        run: test "$(uname -m)" = arm64

      - name: Build app
        run: vp run build:desktop

      - name: Package app
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --skip-build

      - name: Launch packaged app
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/plugin-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" release/*.dmg
          trap 'hdiutil detach "$mount" -force' EXIT
          node scripts/smoke-desktop-app.ts \
            --executable "$mount/T3 Code+.app/Contents/MacOS/T3 Code+" \
            --artifacts-dir "$RUNNER_TEMP/plugin-launch-check"

      - name: Checksums
        working-directory: release
        run: shasum -a 256 ./*.dmg > SHA256SUMS

      - name: Save installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3-code-plugins-macos-arm64
          path: |
            release/*.dmg
            release/SHA256SUMS
          if-no-files-found: error
